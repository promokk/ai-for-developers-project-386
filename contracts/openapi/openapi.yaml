openapi: 3.0.0
info:
  title: Call Calendar API
  description: 'API сервиса «Календарь звонков»: бронирование слотов для звонков.'
  version: 0.0.0
tags:
  - name: service
  - name: event-types
  - name: bookings
paths:
  /api/bookings:
    get:
      operationId: Api_listBookings
      description: Предстоящие бронирования в хронологическом порядке.
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum:
              - upcoming
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '422':
          description: Ошибка валидации параметров запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - bookings
    post:
      operationId: Api_createBooking
      description: Создать бронирование по устаревшему контракту.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyBooking'
      tags:
        - bookings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
  /api/event-types:
    get:
      operationId: Api_listEventTypes
      description: Список типов событий в порядке создания.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
      tags:
        - event-types
  /api/health:
    get:
      operationId: Api_health
      description: Проверка доступности сервиса.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      tags:
        - service
components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
        - fieldErrors
      properties:
        code:
          type: string
          description: Машиночитаемый код ошибки.
        message:
          type: string
          description: Сообщение для пользователя.
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          description: Ошибки полей запроса.
      description: Общий формат ошибки API.
    Booking:
      type: object
      required:
        - id
        - guestName
        - guestEmail
        - startsAt
        - endsAt
        - eventType
      properties:
        id:
          type: string
          description: Идентификатор бронирования.
        guestName:
          type: string
          description: Имя гостя.
        guestEmail:
          type: string
          description: Email гостя.
        startsAt:
          type: string
          format: date-time
          description: Начало слота.
        endsAt:
          type: string
          format: date-time
          description: Вычисленное сервером окончание слота.
        eventType:
          allOf:
            - $ref: '#/components/schemas/EventType'
          description: Тип забронированного события.
      description: Бронирование слота в календаре.
    BookingCreate:
      type: object
      required:
        - name
        - startsAt
        - endsAt
      properties:
        name:
          type: string
          description: Название звонка.
        startsAt:
          type: string
          format: date-time
          description: Начало слота.
        endsAt:
          type: string
          format: date-time
          description: Конец слота.
      description: Данные для создания бронирования по устаревшему контракту.
    EventType:
      type: object
      required:
        - id
        - name
        - description
        - durationMinutes
      properties:
        id:
          type: string
          description: Серверный идентификатор типа события.
        name:
          type: string
          description: Название типа события.
        description:
          type: string
          nullable: true
          description: Необязательное описание типа события.
        durationMinutes:
          type: integer
          description: Длительность события в минутах.
      description: Тип события, доступный для бронирования.
    FieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          description: Имя поля.
        code:
          type: string
          description: Машиночитаемый код ошибки.
        message:
          type: string
          description: Сообщение для пользователя.
      description: Ошибка конкретного поля запроса.
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          description: Текущий статус (`ok` — сервис работает).
      description: Состояние сервиса.
    LegacyBooking:
      type: object
      required:
        - id
        - name
        - startsAt
        - endsAt
      properties:
        id:
          type: string
          description: Идентификатор бронирования.
        name:
          type: string
          description: Название звонка.
        startsAt:
          type: string
          format: date-time
          description: Начало слота.
        endsAt:
          type: string
          format: date-time
          description: Конец слота.
      description: Устаревшее бронирование до перехода POST на общую модель.
servers:
  - url: http://127.0.0.1:8000
    description: Локальная разработка
    variables: {}
